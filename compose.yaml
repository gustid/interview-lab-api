services:
  postgres:
    image: postgres:17-alpine
    container_name: interview-lab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: interview_lab
      POSTGRES_USER: interview_lab
      POSTGRES_PASSWORD: interview_lab_dev
    ports:
      - "5432:5432"
    volumes:
      - interview_lab_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U interview_lab -d interview_lab"
        ]
      interval: 5s
      timeout: 5s
      retries: 5
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: interview-lab-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@interviewlab.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    volumes:
      - interview_lab_pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  interview_lab_postgres_data:
  interview_lab_pgadmin_data: