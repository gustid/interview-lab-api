services:
  postgres:
    image: postgres:17-alpine
    container_name: interview-lab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: interview_lab
      POSTGRES_USER: interview_lab
      POSTGRES_PASSWORD: interview_lab_dev
    ports:
      - "5432:5432"
    volumes:
      - interview_lab_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U interview_lab -d interview_lab"
        ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  interview_lab_postgres_data: