name: Validate backend

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: Format, lint, test and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint:check

      - name: Run unit tests
        run: npm test -- --runInBand --passWithNoTests

      - name: Build application
        run: npm run build

      # The Docker image built by GitHub is only a validation build. Render builds its own image from the same commit.
      - name: Build Docker image
        run: docker build --tag interview-lab-api:${{ github.sha }} .
