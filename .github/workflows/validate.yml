name: Validate backend

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: Format, lint, test and build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: interview_lab
          POSTGRES_PASSWORD: interview_lab
          POSTGRES_DB: interview_lab_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U interview_lab -d interview_lab_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://interview_lab:interview_lab@localhost:5432/interview_lab_test

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint:check

      - name: Run unit tests
        run: npm test -- --runInBand

      - name: Run end-to-end tests
        run: npm run test:e2e -- --runInBand

      - name: Build application
        run: npm run build

      # The Docker image built by GitHub is only a validation build. Render builds its own image from the same commit.
      - name: Build Docker image
        run: docker build --tag interview-lab-api:${{ github.sha }} .
